[package]
name = "eavely"
version = "0.1.11"
edition = "2021"
license = "MIT"

[build-dependencies]
winres = "0.1"

[features]
# ferramentas de captura/benchmark/teste interno (EAVELY_*): NAO entram no exe de release
devtools = []

[dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"
windows-numerics = "0.3"
windows-core = "0.62" # a macro #[implement] referencia o crate pelo nome
windows-future = "0.3" # IAsyncInfo (Status/Cancel) para o timeout do HttpClient
windows = { version = "0.62", features = [
  "Media_Control", "Foundation", "Win32_Foundation", "Win32_System_Com", "Win32_Graphics_Gdi", "Win32_System_LibraryLoader",
  "Win32_Graphics_Dwm", "Win32_System_Diagnostics_Debug", "Win32_System_Kernel", "Win32_UI_Shell", "Win32_UI_WindowsAndMessaging",
  "Storage_Streams", "Graphics_Imaging", "Web_Http", "Web_Http_Headers", "Security_Cryptography", "Win32_System_Ole", "Win32_Graphics_Direct2D", "Win32_Graphics_Direct2D_Common", "Win32_Graphics_Direct3D", "Win32_Graphics_Direct3D11", "Win32_Graphics_DirectComposition", "Win32_Graphics_DirectWrite", "Win32_Graphics_Dxgi", "Win32_Graphics_Dxgi_Common", "Foundation_Numerics", "Win32_UI_HiDpi", "Win32_UI_Accessibility", "Win32_UI_Input", "Win32_UI_Controls", "Win32_Media_Audio", "Win32_Devices_Display", "Win32_System_Wmi", "Win32_Networking_NetworkListManager", "Win32_NetworkManagement_IpHelper", "Win32_Networking_WinSock", "Win32_NetworkManagement_Ndis", "Win32_Devices_Properties", "Win32_UI_Shell_PropertiesSystem", "Win32_Security", "Win32_System_Com_StructuredStorage", "Win32_System_Variant", "Win32_Media_Audio_Endpoints", "Win32_Storage_Xps", "Win32_System_Power", "Win32_NetworkManagement_WiFi", "Win32_System_SystemInformation", "Win32_System_Threading", "Win32_UI_Input_KeyboardAndMouse", "Data_Xml_Dom", "UI_Notifications", "Win32_System_Registry", "Win32_System_Performance", "Win32_System_SystemServices" ] }

[profile.release]
opt-level = "s"
lto = true
codegen-units = 1
panic = "abort"
strip = true
